name: SAST-SCA (prueba B)

on:
  push:
  workflow_dispatch:

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        run: >
          semgrep scan
          --config p/javascript --config p/nodejs --config p/owasp-top-ten
          --metrics=off
          --json --output semgrep-report.json
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  sca:
    name: SCA - Dependency-Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Cache de la base de datos de CVE
        uses: actions/cache@v4
        with:
          path: odc-data
          key: odc-${{ github.run_id }}
          restore-keys: odc-
      - name: Ejecutar Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p odc-data reports
          chmod -R 777 odc-data reports
          docker run --rm \
            -v "$PWD":/src \
            -v "$PWD/odc-data":/usr/share/dependency-check/data \
            -v "$PWD/reports":/report \
            owasp/dependency-check:latest \
            --scan /src --project juice-shop \
            --format JSON --format XML --out /report \
            --nvdApiKey "$NVD_API_KEY"
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/